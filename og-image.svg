<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Source for og-image.png (the 1200x630 link preview). Edit this file, then re-render the PNG
       by opening it at exactly 1200x630 in a browser served over HTTP (so the font loads) and taking a
       screenshot. Colours are the dark-theme tokens from styles.css. -->
  <defs>
    <style>
      @font-face { font-family: "JetBrains Mono NL"; src: url("fonts/webfonts/JetBrainsMonoNL-Regular.woff2") format("woff2"); font-weight: 400; }
      @font-face { font-family: "JetBrains Mono NL"; src: url("fonts/webfonts/JetBrainsMonoNL-Bold.woff2") format("woff2"); font-weight: 700; }
      text { font-family: "JetBrains Mono NL", ui-monospace, Consolas, monospace; }
    </style>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#00e5ff" stroke-opacity="0.07" stroke-width="1"/>
    </pattern>
    <radialGradient id="haze" cx="50%" cy="0%" r="75%">
      <stop offset="0" stop-color="#00e5ff" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <!-- background: var(bg), faint grid, soft glow at the top -->
  <rect width="1200" height="630" fill="#0a0e14"/>
  <rect width="1200" height="630" fill="url(#grid)"/>
  <rect width="1200" height="630" fill="url(#haze)"/>

  <!-- panel: var(surface) with a thin glowing var(accent) border -->
  <rect x="40" y="40" width="1120" height="550" rx="20" fill="#0f1620" fill-opacity="0.9" stroke="#00ff9c" stroke-opacity="0.35" stroke-width="2"/>

  <!-- heading: var(accent), with var(accent-2) for the prompt and cursor (as on the site) -->
  <text x="100" y="200" font-size="104" font-weight="700" fill="#00ff9c"><tspan fill="#00e5ff">&gt;</tspan> KR Encoder<tspan fill="#00e5ff">_</tspan></text>

  <!-- tagline: var(text) -->
  <text x="100" y="300" font-size="40" fill="#d7e3ee">Encrypt and decrypt text or numbers</text>
  <text x="100" y="352" font-size="40" fill="#d7e3ee">with classic and modern ciphers.</text>

  <!-- ciphers and privacy line: var(muted) -->
  <text x="100" y="432" font-size="28" fill="#93a4b8">Caesar · Vigenere · Transposition · AES · RSA</text>
  <text x="100" y="476" font-size="28" fill="#93a4b8">Everything runs in your browser; nothing is sent anywhere.</text>

  <!-- address: var(accent-2) -->
  <text x="100" y="548" font-size="32" font-weight="700" fill="#00e5ff">krencoder.com</text>
</svg>
